<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>物件詳細｜株式会社籠や</title>
  <link rel="stylesheet" href="assets/css/_shared.css">
  <link rel="stylesheet" href="assets/css/sample07-theme.css">
  <style>
    main{padding-bottom:96px}.detail-hero{padding:72px 0 44px;background:#eef6f8}.detail-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:48px;align-items:start}.detail-info{position:sticky;top:24px}.detail-info h2{font-size:clamp(25px,3.4vw,42px);line-height:1.35;margin:13px 0 16px;color:#10354f}.detail-info .date{font:12px var(--font-en);color:#648496}.detail-info .type{display:inline-block;border:1px solid #b8ced9;border-radius:99px;padding:5px 11px;color:#47758b;font-size:11px}.property-tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.property-tags .tag{display:inline-flex;align-items:center;border-radius:999px;padding:6px 11px;font-size:11px;line-height:1.25;font-weight:700}.property-tags .tag--category{color:#fff;background:#e89300}.property-tags .tag--hash{color:#11647d;background:#e7f3f5}.slideshow{border:1px solid #d9e2e8;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 14px 34px rgba(14,53,80,.08)}.slide-main{position:relative;display:flex;align-items:center;justify-content:center;min-height:500px;background:#eef3f5}.slide-image-link{display:flex;width:100%;height:500px;align-items:center;justify-content:center}.slide-main img{display:block;width:100%;height:100%;object-fit:contain}.slide-arrow{position:absolute;z-index:2;top:50%;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:#16a6aa;color:#fff;font-size:26px;line-height:1;cursor:pointer;transform:translateY(-50%);box-shadow:0 4px 13px rgba(8,67,81,.22);transition:transform .2s,background .2s}.slide-arrow:hover{background:#0f858b;transform:translateY(-50%) scale(1.06)}.slide-arrow:focus-visible{outline:3px solid #e8b33d;outline-offset:3px}.slide-arrow--prev{left:16px}.slide-arrow--next{right:16px}.slide-bottom{display:flex;align-items:center;gap:16px;padding:14px 16px;border-top:1px solid #d9e2e8}.slide-thumbs{display:flex;gap:8px;min-width:0;overflow-x:auto;padding:2px}.slide-thumb{flex:0 0 72px;height:58px;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;background:#eef3f5;cursor:pointer;opacity:.7;transition:opacity .2s,border-color .2s}.slide-thumb:hover,.slide-thumb.is-active{border-color:#16a6aa;opacity:1}.slide-thumb img{display:block;width:100%;height:100%;object-fit:cover}.slide-count{margin-left:auto;white-space:nowrap;color:#60727d;font:12px var(--font-en)}.price{font-size:26px;font-weight:700;color:#0f627c;margin:18px 0 20px}.detail-specs{border-top:1px solid #d9e2e8;border-bottom:1px solid #d9e2e8;padding:12px 0;display:grid;grid-template-columns:110px 1fr;gap:10px 16px;font-size:13px}.detail-specs dt{color:#7a8d97}.detail-specs dd{margin:0;color:#304f62;line-height:1.7}.detail-copy{margin-top:26px;color:#536873;line-height:1.95}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.detail-actions a{display:inline-block;padding:13px 18px;border:1px solid #123650;border-radius:4px;text-decoration:none;color:#123650;font-weight:700;font-size:13px}.detail-actions a.primary{background:#123650;color:#fff}.detail-note{margin-top:46px;padding:18px 20px;background:#f7fafb;color:#60727d;font-size:12px;line-height:1.8}.back{display:inline-block;margin-top:30px;color:#14647f;text-decoration:none}@media(max-width:860px){.detail-layout{grid-template-columns:1fr;gap:30px}.detail-info{position:static}.slide-main,.slide-image-link{min-height:390px;height:390px}}@media(max-width:600px){.detail-hero{padding:54px 0 34px}.slide-main,.slide-image-link{min-height:260px;height:260px}.slide-arrow{width:36px;height:36px;font-size:21px}.slide-arrow--prev{left:9px}.slide-arrow--next{right:9px}.slide-thumb{flex-basis:62px;height:50px}.detail-specs{grid-template-columns:90px 1fr}.detail-note{margin-top:30px}}
  </style>
</head>
<body class="sample07-subpage">
  <header class="site-header"><div class="site-header__topbar"><div class="in"><span>売却を急がず、不動産の選択肢を整理する。</span><div class="right"><span>10:00–18:00／木曜定休</span><span class="tel">03-4400-7994</span><a href="contact.html">相談する</a></div></div></div><div class="site-header__main"><a class="site-header__brand" href="index.html"><img src="src/logo.png" alt="KAGOYA 株式会社籠や"></a><nav class="site-header__nav is-right"><a href="for-sale.html">販売中物件</a><a href="news.html">お知らせ</a><a href="contact.html">相談する</a></nav></div><div class="site-header__strip"></div></header>
  <main id="main"><section class="detail-hero"><div class="wrap"><p class="crumb"><a href="index.html">ホーム</a> ／ <a href="for-sale.html">販売中物件</a> ／ 物件詳細</p><span class="eyebrow">PROPERTY DETAILS</span><h1>販売中物件の詳細</h1><p class="lead">公式サイトに掲載されていた画像と物件情報を、このサイト内へ移行しています。</p></div></section><section class="page-sec"><div class="wrap" id="detail"></div></section></main>
  <footer class="site-footer"><div class="site-footer__cp"><div class="in"><span>© KAGOYA Co., Ltd.</span><span>東京都知事（1）第108542号</span></div></div></footer>
  <script>
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const labels={'種別':'種別','所在地':'所在地','価格':'価格','交通':'交通','建物面積／土地面積':'建物面積／土地面積','建物面積／／土地面積':'建物面積／土地面積','築年月':'築年月','間取り':'間取り','その他':'その他'};
    const requestedSlug=decodeURIComponent(location.hash.slice(1));
    const aliases={'cosmo-kawagoe':'cosumosithykawagoe5120','towa-hatsudai':'touwashityikopuhatudai','heim-yaguchidai':'haimuyakouguthi8900','sugita-building':'sugitaittyoumetennpobill12500','meguro-shimomeguro-a':'megurokushimomegurokodate','meguro-shimomeguro-b':'megurokushimomegurokodateb','grand-sweet-azabudai':'guransui-toazabudaihiruzutawa','meguro-gohongi':'megurokuohongikodate','brillia-tsujido':'brilliasyounanntsujidou','mark-plaza-mishima':'ma-kupurazamishimahirokouji','setagaya-okamoto':'setagayakuokamototochi16800','amagasaki-mukomachi':'amagasakittyoumekodate'};
    const slug=aliases[requestedSlug]||requestedSlug;
    const tagMarkup=(item)=>{const categories=item.categories||[],tags=item.tags||[];return [...categories.map(name=>`<span class="tag tag--category">${esc(name)}</span>`),...tags.map(name=>`<span class="tag tag--hash">#${esc(name)}</span>`)].join('');};
    fetch('data/sale-items.json').then(r=>r.json()).then(data=>{
      const item=data.items.find(x=>x.slug===slug)||data.items[0];
      if(!item){document.getElementById('detail').innerHTML='<p>物件情報が見つかりません。</p>';return;}
      const f=item.fields||{};const rows=Object.entries(f).filter(([k,v])=>v&&labels[k]);const gallery=item.gallery&&item.gallery.length?item.gallery:[item.image].filter(Boolean);
      document.title=`${item.title}｜物件詳細｜株式会社籠や`;
      document.getElementById('detail').innerHTML=`<div class="detail-layout"><div><div class="property-tags">${tagMarkup(item)}</div><div class="slideshow" data-slideshow><div class="slide-main"><button class="slide-arrow slide-arrow--prev" type="button" aria-label="前の画像">←</button><a class="slide-image-link" id="slideLink" href="${esc(gallery[0]||'')}" target="_blank" rel="noopener"><img id="slideImage" src="${esc(gallery[0]||'')}" alt="${esc(item.title)} 写真1"></a><button class="slide-arrow slide-arrow--next" type="button" aria-label="次の画像">→</button></div><div class="slide-bottom"><div class="slide-thumbs">${gallery.map((src,i)=>`<button class="slide-thumb${i===0?' is-active':''}" type="button" data-index="${i}" aria-label="${i+1}枚目の画像"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div><span class="slide-count" id="slideCount">1 / ${gallery.length}</span></div></div><div class="detail-note">画像は元サイトに掲載されていたギャラリーを移行しています。価格や募集状況は変更される場合があります。画像をクリックすると大きなサイズで開けます。</div></div><div class="detail-info"><div class="property-tags">${tagMarkup(item)}</div>${f['種別']?`<span class="type">${esc(f['種別'])}</span>`:''}<h2>${esc(item.title)}</h2><div class="date">掲載日 ${esc((item.date||'').replaceAll('-','.'))}</div>${f['価格']?`<p class="price">${esc(f['価格'])}</p>`:''}<dl class="detail-specs">${rows.map(([k,v])=>`<dt>${esc(labels[k])}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="detail-copy">この物件の条件や購入判断について、状況に合わせてご相談いただけます。資料がそろっていない段階でも、分かる範囲からお聞かせください。</p><div class="detail-actions"><a class="primary" href="contact.html">この物件について相談する</a><a href="for-sale.html">一覧へ戻る</a></div></div></div>`;
      const slide=document.querySelector('[data-slideshow]');const image=document.getElementById('slideImage');const link=document.getElementById('slideLink');const count=document.getElementById('slideCount');const thumbs=[...document.querySelectorAll('.slide-thumb')];const prev=slide.querySelector('.slide-arrow--prev');const next=slide.querySelector('.slide-arrow--next');let current=0;let timer;
      const show=(index)=>{current=(index+gallery.length)%gallery.length;const src=gallery[current];image.src=src;image.alt=`${item.title} 写真${current+1}`;link.href=src;count.textContent=`${current+1} / ${gallery.length}`;thumbs.forEach((thumb,i)=>{thumb.classList.toggle('is-active',i===current);thumb.setAttribute('aria-current',i===current?'true':'false');});};
      const stop=()=>{if(timer){clearInterval(timer);timer=undefined;}};const start=()=>{stop();if(gallery.length>1)timer=setInterval(()=>show(current+1),5000);};
      prev.addEventListener('click',()=>{show(current-1);start();});next.addEventListener('click',()=>{show(current+1);start();});thumbs.forEach((thumb,i)=>thumb.addEventListener('click',()=>{show(i);start();}));slide.addEventListener('mouseenter',stop);slide.addEventListener('mouseleave',start);show(0);start();
    }).catch(()=>{document.getElementById('detail').innerHTML='<p>物件情報の読み込みに失敗しました。</p>';});
  </script>
</body>
</html>
