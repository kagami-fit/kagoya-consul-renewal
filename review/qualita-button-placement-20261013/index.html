<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUALITA｜価格帯ボタンの配置比較</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#140e0c;font-family:sans-serif}header{padding:26px max(20px,calc((100% - 1200px)/2));background:#140e0c;color:#f4f0e7}h1{font-size:22px;font-weight:400;margin:0 0 12px}header p{font-size:13px;line-height:1.8;color:#d9cbb3}nav{display:flex;gap:10px;flex-wrap:wrap}button{padding:13px 18px;border:1px solid #a37a3d;background:transparent;color:#f4f0e7;cursor:pointer;font-size:14px}button[aria-pressed=true]{background:#eaddb8;color:#140e0c}iframe{border:0;width:100%;display:block;min-height:1000px}#description{margin-bottom:0}</style></head><body><header><h1>価格帯ボタンの配置比較</h1><p>ボタンの位置を3種類で比較できます。現在のLPはそのまま保存しています。</p><nav aria-label="配置案"><button data-design="a" aria-pressed="true">A｜価格帯見出しの下</button><button data-design="b" aria-pressed="false">B｜価格・利回りの下</button><button data-design="c" aria-pressed="false">C｜詳細ボタンの隣</button></nav><p id="description">価格帯を見た直後に、同じ価格帯の販売物件へ進める配置。</p></header><iframe title="A案のボタン配置" src="a.html"></iframe><script>const frame=document.querySelector('iframe');const descriptions={a:'価格帯を見た直後に、同じ価格帯の販売物件へ進める配置。',b:'物件の価格・利回りなどを確認した後に、同じ価格帯の物件を探せる配置。',c:'この物件の詳細を見るか、同じ価格帯の物件を探すかを選べる配置。'};function show(x){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===x)));frame.src=x+'.html';frame.title=x.toUpperCase()+'案のボタン配置';document.querySelector('#description').textContent=descriptions[x];history.replaceState(null,'','#'+x)}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.design));if(Object.hasOwn(descriptions,location.hash.slice(1)))show(location.hash.slice(1));addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='height')frame.style.height=e.data.height+'px'})</script></body></html>
