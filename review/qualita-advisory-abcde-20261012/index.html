<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>QUALITA｜専門家相談A〜E案の比較・選択</title><link rel="stylesheet" href="selection.css?v=abcde-marble-1"></head><body><header><div class="heading"><div><p class="eyebrow">QUALITA · DESIGN REVIEW</p><h1>専門家への相談案内｜5案比較</h1></div><p class="guide">5つのデザインを比較して、<br>ご希望の案をお選びください。</p></div></header><nav class="comparison-nav" aria-label="比較するデザイン"><div class="nav-inner"><div class="design-tabs" role="tablist" aria-label="デザイン案"><button type="button" role="tab" data-design="a" aria-selected="true"><b>A案</b><span>アイボリーの誌面</span><small>写真</small></button><button type="button" role="tab" data-design="b" aria-selected="false"><b>B案</b><span>写真ギャラリー</span><small>写真</small></button><button type="button" role="tab" data-design="c" aria-selected="false"><b>C案</b><span>大理石とアーチ写真</span><small>写真</small></button><button type="button" role="tab" data-design="d" aria-selected="false"><b>D案</b><span>大理石と金の枠</span><small>図形</small></button><button type="button" role="tab" data-design="e" aria-selected="false"><b>E案</b><span>ゴールドのアーチ</span><small>図形</small></button></div><div class="choice-row"><p id="viewing">表示中：A案｜アイボリーの誌面</p><button id="choose" type="button">この案を選ぶ</button></div><section id="answer" hidden aria-label="希望案の返信"><p id="answer-title" role="status"></p><p class="answer-guide">下の返信文をコピーして、共有元の方へお送りください。</p><textarea id="reply" readonly aria-label="希望案の返信文" rows="3"></textarea><div class="answer-actions"><button id="copy" type="button">返信文をコピー</button><span id="copy-status" role="status"></span></div></section></div></nav><p class="preview-note">「ご相談から、具体的なご検討へ。」の4ステップ直下に設置した状態です。相談フォームの上端まで表示しています。</p><iframe id="preview" src="a.html" title="A案の実配置プレビュー"></iframe><footer>相談案内はリンクなし。希望案を選んだ後、返信文を共有元の方へお送りください。</footer><script src="selection.js?v=abcde-marble-1"></script></body></html>
