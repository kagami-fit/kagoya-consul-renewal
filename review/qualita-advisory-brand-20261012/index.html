<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>A〜F案｜QUALITAのトンマナ統一版</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#251d16;font-family:"Hiragino Kaku Gothic ProN",sans-serif}.preview-bar{position:sticky;top:0;z-index:10;padding:16px 24px;background:#18130f;color:#f6f0e5;box-shadow:0 3px 10px #0002}.controls{max-width:1200px;margin:auto;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.title{font-size:14px;margin:0}.tabs{display:flex;gap:8px}button{font:inherit;font-size:14px;padding:10px 20px;border:1px solid #90764a;background:transparent;color:inherit;cursor:pointer}button[aria-selected="true"]{background:#d9bc79;color:#21180f;border-color:#d9bc79}button:focus-visible{outline:3px solid white;outline-offset:3px}.hint{max-width:1200px;margin:10px auto 0;color:#c3b8a5;font-size:11px;line-height:1.8}iframe{border:0;width:100%;display:block;min-height:1600px}@media(max-width:600px){.preview-bar{padding:14px 16px}.controls{gap:12px}.tabs{width:100%;gap:6px}.tabs button{flex:1;padding:10px 0}.hint{font-size:10px}}</style></head><body><header class="preview-bar"><div class="controls"><p class="title">A〜F案｜LPのトンマナに統一</p><div class="tabs" role="tablist" aria-label="デザイン案"><button type="button" role="tab" aria-selected="true" data-design="a" aria-controls="preview">A案</button><button type="button" role="tab" aria-selected="false" data-design="b" aria-controls="preview">B案</button><button type="button" role="tab" aria-selected="false" data-design="c" aria-controls="preview">C案</button><button type="button" role="tab" aria-selected="false" data-design="d" aria-controls="preview">D案</button><button type="button" role="tab" aria-selected="false" data-design="e" aria-controls="preview">E案</button><button type="button" role="tab" aria-selected="false" data-design="f" aria-controls="preview">F案</button></div></div><p class="hint">「ご相談から、具体的なご検討へ。」の4ステップ直下・相談フォームの直前に挿入した状態です。LPと同じアイボリー・黒茶・ゴールド・書体で統一。相談案内はリンクなし。フォームは見え方の確認用です。</p></header><iframe id="preview" title="A案の実配置プレビュー" src="a.html"></iframe><script>const frame=document.querySelector('iframe');const buttons=[...document.querySelectorAll('[data-design]')];function select(x){buttons.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.design===x)));frame.src=x+'.html';frame.title=x.toUpperCase()+'案の実配置プレビュー';history.replaceState(null,'','#'+x);frame.style.height='1600px';window.scrollTo(0,0)}buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.design)));const initial=location.hash.slice(1).toLowerCase();if('abcdef'.includes(initial)&&initial.length===1)select(initial);addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin&&e.data.type==='preview-height'&&Number.isFinite(e.data.height))frame.style.height=e.data.height+'px'});</script></body></html>
