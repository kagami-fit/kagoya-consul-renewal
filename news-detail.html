<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お知らせ詳細｜株式会社籠や</title>
  <link rel="stylesheet" href="assets/css/_shared.css">
  <link rel="stylesheet" href="assets/css/sample07-theme.css">
  <style>
    main{padding-bottom:80px}.detail-hero{padding:90px 0 55px;background:#eef6f8}.news-detail{display:grid;gap:18px}.news-detail article{background:#fff;border-bottom:1px solid #d9e2e8;padding:34px 0 40px;scroll-margin-top:30px}.news-detail__meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.news-detail time{color:#55798e;font-family:var(--font-en);font-size:13px}.news-detail .tag{display:inline-flex;padding:4px 11px;border:1px solid #b8ced9;border-radius:99px;color:#14647f;font-size:11px}.news-detail h2{margin:12px 0 22px;font-size:clamp(21px,3vw,32px);line-height:1.55}.news-detail__body{max-width:760px;color:#536873;line-height:2}.news-detail__body p{margin:0 0 1em}.news-detail__body p:last-child{margin-bottom:0}.news-detail__body a{color:#14647f;text-decoration:underline}.news-detail__body img{max-width:100%;height:auto}.news-detail__source{margin-top:28px;font-size:12px;color:#7a8d97}.news-detail__source a{color:#14647f}.news-detail__back{display:inline-flex;margin-top:32px;color:#14647f;text-decoration:none;font-weight:700}.news-detail__back:hover{text-decoration:underline}.news-empty{padding:60px 0;color:#536873}
  </style>
</head>
<body class="sample07-subpage">
  <header class="site-header"><div class="site-header__topbar"><div class="in"><span>売却を急がず、不動産の選択肢を整理する。</span><div class="right"><span>10:00–18:00／木曜定休</span><span class="tel">03-4400-7994</span><a href="contact.html">相談する</a></div></div></div><div class="site-header__main"><a class="site-header__brand" href="index.html"><img src="src/logo.png" alt="KAGOYA 株式会社籠や"></a><nav class="site-header__nav is-right"><a href="for-sale.html">販売中物件</a><a href="news.html">お知らせ</a><a href="contact.html">相談する</a></nav></div><div class="site-header__strip"></div></header>
  <main id="main"><section class="detail-hero"><div class="wrap"><p class="crumb"><a href="index.html">ホーム</a> ／ <a href="news.html">お知らせ</a> ／ 詳細</p><span class="eyebrow">NOTICE DETAILS</span><h1>お知らせ詳細</h1><p class="lead">元サイトのお知らせ本文を、このサイト内で確認できます。</p></div></section><section class="page-sec"><div class="wrap news-detail" id="newsDetail"></div></section></main>
  <footer class="site-footer"><div class="site-footer__cp"><div class="in"><span>© KAGOYA Co., Ltd.</span><span>東京都知事（1）第108542号</span></div></div></footer>
  <script>
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const requested=decodeURIComponent(location.hash.slice(1));
    fetch('data/news-items.json').then(r=>r.json()).then(data=>{
      const item=data.items.find(x=>x.slug===requested)||data.items[0];
      const root=document.getElementById('newsDetail');
      if(!item){root.innerHTML='<p class="news-empty">お知らせが見つかりません。</p>';return;}
      document.title=`${item.title}｜お知らせ｜株式会社籠や`;
      root.innerHTML=`<article id="${esc(item.slug)}"><div class="news-detail__meta"><time datetime="${esc(item.date)}">${esc(item.date.replaceAll('-','.'))}</time><span class="tag">${esc(item.kind||item.category||'お知らせ')}</span></div><h2>${esc(item.title)}</h2><div class="news-detail__body">${item.contentHtml||`<p>${esc(item.excerpt||'')}</p>`}</div><p class="news-detail__source">出典：元サイト「お知らせ」／ <a href="${esc(item.sourceUrl)}" target="_blank" rel="noopener">公式ページを確認する</a></p></article><a class="news-detail__back" href="news.html">← お知らせ一覧へ戻る</a>`;
    }).catch(()=>{document.getElementById('newsDetail').innerHTML='<p class="news-empty">お知らせデータの読み込みに失敗しました。</p>';});
  </script>
</body>
</html>
