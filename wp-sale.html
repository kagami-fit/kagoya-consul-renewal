<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordPress移行物件一覧｜株式会社籠や</title>
<link rel="stylesheet" href="assets/css/_shared.css"><link rel="stylesheet" href="assets/css/sample07-theme.css">
<style>
main{padding-bottom:80px}.hero{padding:88px 0 54px;background:#eef6f8}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.item{border:1px solid #d9e2e8;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(14,53,80,.08);transition:.2s}.item:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(14,53,80,.14)}.item img{display:block;width:100%;height:210px;object-fit:cover;background:#eef3f5}.item-body{padding:20px}.item time{font:12px var(--font-en);color:#5a8198}.item h2{font-size:19px;line-height:1.55;margin:8px 0 14px;color:#10354f}.type{display:inline-block;border:1px solid #b8ced9;border-radius:99px;padding:4px 10px;color:#47758b;font-size:11px}.specs{display:grid;grid-template-columns:82px 1fr;gap:7px 12px;border-top:1px solid #e4ebef;padding-top:14px;margin:14px 0;color:#536873;font-size:12px}.specs dt{color:#7a8d97}.specs dd{margin:0;color:#304f62}.item a{color:#14647f;font-size:13px;text-decoration:none;font-weight:700}.item a:hover{text-decoration:underline}@media(max-width:900px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.items{grid-template-columns:1fr}.item img{height:220px}}
</style></head>
<body class="sample07-subpage"><header class="site-header"><div class="site-header__topbar"><div class="in"><span>売却を急がず、不動産の選択肢を整理する。</span><div class="right"><span>10:00–18:00／木曜定休</span><span class="tel">03-4400-7994</span><a href="contact.html">相談する</a></div></div></div><div class="site-header__main"><a class="site-header__brand" href="index.html"><img src="src/logo.png" alt="KAGOYA 株式会社籠や"></a><nav class="site-header__nav is-right"><a href="for-sale.html">販売中物件</a><a href="news.html">お知らせ</a><a href="contact.html">相談する</a></nav></div><div class="site-header__strip"></div></header>
<main><section class="hero"><div class="wrap"><p class="crumb"><a href="index.html">ホーム</a> ／ <a href="for-sale.html">販売中物件</a> ／ 全件</p><span class="eyebrow">WORDPRESS MIGRATION</span><h1>WordPress掲載物件 全件</h1><p class="lead">元ホームページの販売中物件データを、画像・価格・所在地・交通などと一緒に移行しています。</p><p id="count"></p></div></section><section class="page-sec"><div class="wrap"><div class="items" id="items"></div></div></section></main>
<footer class="site-footer"><div class="site-footer__cp"><div class="in"><span>© KAGOYA Co., Ltd.</span><span>東京都知事（1）第108542号</span></div></div></footer>
<script>
fetch('data/sale-items.json').then(r=>r.json()).then(data=>{document.getElementById('count').textContent=`移行件数：${data.count}件`;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('items').innerHTML=data.items.map(item=>{const f=item.fields||{};const rows=[['種別',f['種別']],['所在地',f['所在地']],['価格',f['価格']],['交通',f['交通']],['面積',f['建物面積／／土地面積']||f['建物面積／土地面積']],['築年月',f['築年月']],['間取り',f['間取り']],['その他',f['その他']]].filter(x=>x[1]);return `<article class="item"><img src="${item.image||'src/gen-for-sale.jpg'}" alt="${esc(item.title)}" loading="lazy"><div class="item-body"><time datetime="${item.date}">${item.date.replaceAll('-','.')}</time><h2>${esc(item.title)}</h2>${f['種別']?`<span class="type">${esc(f['種別'])}</span>`:''}<dl class="specs">${rows.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><a href="property-detail.html#${encodeURIComponent(item.slug)}">このサイト内の詳細を見る →</a></div></article>`}).join('')}).catch(()=>{document.getElementById('count').textContent='データの読み込みに失敗しました。';});
</script></body></html>
