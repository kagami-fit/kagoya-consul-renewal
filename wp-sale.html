<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordPress移行物件一覧｜株式会社籠や</title><link rel="stylesheet" href="assets/css/_shared.css"><link rel="stylesheet" href="assets/css/sample07-theme.css"><style>main{padding-bottom:80px}.hero{padding:88px 0 54px;background:#eef6f8}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.item{border:1px solid #d9e2e8;background:#fff;border-radius:12px;overflow:hidden}.item img{width:100%;height:180px;object-fit:cover;background:#eef3f5}.item-body{padding:18px}.item h2{font-size:18px;margin:7px 0 12px}.item time{font:12px var(--font-en);color:#5a8198}.item p{color:#60727d;font-size:13px}@media(max-width:900px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.items{grid-template-columns:1fr}}</style></head><body class="sample07-subpage"><header class="site-header"><div class="site-header__topbar"><div class="in"><span>売却を急がず、不動産の選択肢を整理する。</span><div class="right"><span>10:00–18:00／木曜定休</span><span class="tel">03-4400-7994</span><a href="contact.html">相談する</a></div></div></div><div class="site-header__main"><a class="site-header__brand" href="index.html"><img src="src/logo.png" alt="KAGOYA 株式会社籠や"></a><nav class="site-header__nav is-right"><a href="for-sale.html">販売中物件</a><a href="news.html">お知らせ</a><a href="contact.html">相談する</a></nav></div><div class="site-header__strip"></div></header><main><section class="hero"><div class="wrap"><p class="crumb"><a href="index.html">ホーム</a> ／ <a href="for-sale.html">販売中物件</a> ／ 全件</p><span class="eyebrow">WORDPRESS MIGRATION</span><h1>WordPress掲載物件 全件</h1><p class="lead">元ホームページの販売中物件データを、画像付きでこのサイトへ移行しています。</p><p id="count"></p></div></section><section class="page-sec"><div class="wrap"><div class="items" id="items"></div></div></section></main><footer class="site-footer"><div class="site-footer__cp"><div class="in"><span>© KAGOYA Co., Ltd.</span><span>東京都知事（1）第108542号</span></div></div></footer><script>fetch('data/sale-items.json').then(r=>r.json()).then(data=>{document.getElementById('count').textContent=`移行件数：${data.count}件`;document.getElementById('items').innerHTML=data.items.map(item=>`<article class="item"><img src="${item.image||'src/gen-for-sale.jpg'}" alt="${item.title}" loading="lazy"><div class="item-body"><time datetime="${item.date}">${item.date.replaceAll('-','.')}</time><h2>${item.title}</h2><p>WordPress掲載物件（移行データ）</p><a href="property-detail.html#${item.slug}">このサイト内の詳細を見る →</a></div></article>`).join('')}).catch(()=>{document.getElementById('count').textContent='データの読み込みに失敗しました。';});</script></body></html>
